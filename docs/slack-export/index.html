<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saiteki Slack Export</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #d9dee7;
    --text: #172033;
    --muted: #667085;
    --accent: #0f766e;
    --accent-soft: #dff3ef;
    --system: #f3f4f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    letter-spacing: 0;
  }
  .shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 18px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: auto;
  }
  main {
    padding: 22px 26px 48px;
    min-width: 0;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 6px;
  }
  .meta {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 16px 0;
  }
  .stat {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    background: #fbfcfd;
  }
  .stat b {
    display: block;
    font-size: 18px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 12px 0 6px;
  }
  input, select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    font-size: 14px;
    padding: 9px 10px;
  }
  .channels {
    margin-top: 16px;
    display: grid;
    gap: 6px;
  }
  .channel {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 9px 10px;
    text-align: left;
    cursor: pointer;
  }
  .channel.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .channel-name {
    font-weight: 700;
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .channel-meta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
  }
  .toolbar {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) 170px 170px 150px;
    gap: 10px;
    align-items: end;
    margin-bottom: 14px;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .title-row h2 {
    margin: 0 0 6px;
    font-size: 22px;
  }
  .messages {
    display: grid;
    gap: 10px;
  }
  .message {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .message.system {
    background: var(--system);
  }
  .thread-section {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    overflow: hidden;
  }
  .thread-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 9px 12px;
    background: var(--accent-soft);
    border-bottom: 1px solid var(--line);
    color: #115e59;
    font-size: 12px;
    font-weight: 700;
  }
  .thread-header .meta {
    font-weight: 400;
    color: #47736f;
  }
  .thread-section .message {
    border: 0;
    border-radius: 0;
    border-bottom: 1px solid var(--line);
  }
  .thread-section .message:last-child {
    border-bottom: 0;
  }
  .message.thread-context {
    background: #fbfcfd;
  }
  .message-head {
    display: flex;
    gap: 8px;
    align-items: baseline;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .author {
    font-weight: 700;
  }
  .time, .tag {
    color: var(--muted);
    font-size: 12px;
  }
  .tag {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 7px;
    background: #fff;
  }
  .text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.65;
    font-size: 14px;
  }
  .empty {
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 24px;
    color: var(--muted);
    text-align: center;
    background: #fff;
  }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    aside { position: static; height: auto; }
    .toolbar { grid-template-columns: 1fr; }
    main { padding: 18px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <h1>Slack Export</h1>
    <div class="meta" id="exportMeta"></div>
    <div class="stats">
      <div class="stat"><b id="channelCount">0</b><span class="meta">channels</span></div>
      <div class="stat"><b id="messageCount">0</b><span class="meta">messages</span></div>
    </div>
    <label for="channelSearch">チャンネル検索</label>
    <input id="channelSearch" type="search" autocomplete="off">
    <div class="channels" id="channels"></div>
  </aside>
  <main>
    <div class="title-row">
      <div>
        <h2 id="channelTitle"></h2>
        <div class="meta" id="channelMeta"></div>
      </div>
    </div>
    <div class="toolbar">
      <div>
        <label for="messageSearch">本文・投稿者検索</label>
        <input id="messageSearch" type="search" autocomplete="off">
      </div>
      <div>
        <label for="dateFrom">開始日</label>
        <input id="dateFrom" type="date">
      </div>
      <div>
        <label for="dateTo">終了日</label>
        <input id="dateTo" type="date">
      </div>
      <div>
        <label for="systemMode">表示</label>
        <select id="systemMode">
          <option value="all">すべて</option>
          <option value="messages">通常投稿のみ</option>
          <option value="system">システム投稿のみ</option>
        </select>
      </div>
    </div>
    <div class="messages" id="messages"></div>
  </main>
</div>
<script src="./slack-export-data.js"></script>
<script>
const data = window.SLACK_EXPORT_DATA;
const state = {
  channelId: data.channels[0]?.id || '',
  channelSearch: '',
  messageSearch: '',
  dateFrom: '',
  dateTo: '',
  systemMode: 'all'
};

const els = {
  exportMeta: document.getElementById('exportMeta'),
  channelCount: document.getElementById('channelCount'),
  messageCount: document.getElementById('messageCount'),
  channelSearch: document.getElementById('channelSearch'),
  channels: document.getElementById('channels'),
  channelTitle: document.getElementById('channelTitle'),
  channelMeta: document.getElementById('channelMeta'),
  messageSearch: document.getElementById('messageSearch'),
  dateFrom: document.getElementById('dateFrom'),
  dateTo: document.getElementById('dateTo'),
  systemMode: document.getElementById('systemMode'),
  messages: document.getElementById('messages')
};

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

function formatDateTime(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return new Intl.DateTimeFormat('ja-JP', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  }).format(date);
}

function currentChannel() {
  return data.channels.find(channel => channel.id === state.channelId) || data.channels[0];
}

function filteredChannels() {
  const query = state.channelSearch.trim().toLowerCase();
  if (!query) return data.channels;
  return data.channels.filter(channel => channel.name.toLowerCase().includes(query));
}

function filteredMessages(channel) {
  const query = state.messageSearch.trim().toLowerCase();
  return (channel?.messages || []).filter(message => {
    if (state.dateFrom && message.date < state.dateFrom) return false;
    if (state.dateTo && message.date > state.dateTo) return false;
    const isSystem = Boolean(message.subtype);
    if (state.systemMode === 'messages' && isSystem) return false;
    if (state.systemMode === 'system' && !isSystem) return false;
    if (!query) return true;
    return [message.text, message.rawText, message.userName, message.userRealName, message.subtype]
      .filter(Boolean)
      .some(value => String(value).toLowerCase().includes(query));
  });
}

function threadKey(message) {
  return message.threadTs ? message.channelId + ':' + message.threadTs : '';
}

function buildThreadCounts(channel) {
  const counts = new Map();
  for (const message of channel?.messages || []) {
    const key = threadKey(message);
    if (!key) continue;
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  return counts;
}

function buildMessageSections(channel, messages) {
  const threadCounts = buildThreadCounts(channel);
  const parentByThread = new Map();
  for (const message of channel?.messages || []) {
    const key = threadKey(message);
    if (key && message.messageTs === message.threadTs) parentByThread.set(key, message);
  }

  const sections = [];
  const sectionByThread = new Map();
  for (const message of messages) {
    const key = threadKey(message);
    const isThreaded = key && (threadCounts.get(key) > 1 || message.messageTs !== message.threadTs);
    if (!isThreaded) {
      sections.push({ type: 'single', messages: [message] });
      continue;
    }

    if (!sectionByThread.has(key)) {
      const section = {
        type: 'thread',
        key,
        parent: parentByThread.get(key),
        totalCount: threadCounts.get(key) || 0,
        messages: []
      };
      sectionByThread.set(key, section);
      sections.push(section);
    }
    sectionByThread.get(key).messages.push(message);
  }

  return sections;
}

function renderChannels() {
  els.channels.innerHTML = filteredChannels().map(channel =>
    '<button class="channel ' + (channel.id === state.channelId ? 'active' : '') + '" data-channel-id="' + escapeHtml(channel.id) + '">' +
      '<div class="channel-name">#' + escapeHtml(channel.name) + '</div>' +
      '<div class="channel-meta">' + channel.messageCount.toLocaleString() + ' messages / ' + escapeHtml(channel.firstDate || '-') + ' - ' + escapeHtml(channel.lastDate || '-') + '</div>' +
    '</button>'
  ).join('');
}

function renderMessages() {
  const channel = currentChannel();
  const messages = filteredMessages(channel);
  const sections = buildMessageSections(channel, messages);
  els.channelTitle.textContent = channel ? '#' + channel.name : '';
  els.channelMeta.textContent = channel
    ? messages.length.toLocaleString() + ' / ' + channel.messageCount.toLocaleString() + ' messages, ' + (channel.firstDate || '-') + ' - ' + (channel.lastDate || '-')
    : '';
  els.messages.innerHTML = sections.length ? sections.map(renderSection).join('') : '<div class="empty">該当するメッセージはありません。</div>';
}

function renderSection(section) {
  if (section.type === 'single') return renderMessage(section.messages[0]);

  const parentIsVisible = section.parent && section.messages.some(message => message.messageTs === section.parent.messageTs);
  const context = section.parent && !parentIsVisible ? renderMessage(section.parent, { isContext: true, isThreadParent: true }) : '';
  const visibleCount = section.messages.length;
  const totalCount = Math.max(section.totalCount || 0, visibleCount);
  return '<section class="thread-section">' +
    '<div class="thread-header">' +
      '<span>スレッド</span>' +
      '<span class="meta">表示 ' + visibleCount.toLocaleString() + ' / 全 ' + totalCount.toLocaleString() + ' 件</span>' +
    '</div>' +
    context +
    section.messages.map(message => renderMessage(message, { isThreadParent: message.threadTs === message.messageTs })).join('') +
  '</section>';
}

function renderMessage(message, options) {
  const opts = options || {};
  const classNames = ['message'];
  if (message.subtype) classNames.push('system');
  if (opts.isContext) classNames.push('thread-context');
  return (
    '<article class="' + classNames.join(' ') + '">' +
      '<div class="message-head">' +
        '<span class="author">' + escapeHtml(message.userName) + '</span>' +
        '<span class="time">' + escapeHtml(formatDateTime(message.timestamp)) + '</span>' +
        (opts.isThreadParent ? '<span class="tag">親投稿</span>' : '') +
        (message.subtype ? '<span class="tag">' + escapeHtml(message.subtype) + '</span>' : '') +
        (message.threadTs && message.threadTs !== message.messageTs ? '<span class="tag">返信</span>' : '') +
      '</div>' +
      '<div class="text">' + escapeHtml(message.text || message.rawText || '(no text)') + '</div>' +
    '</article>'
  );
}

function render() {
  els.exportMeta.textContent = data.exportName + ' / ' + data.generatedAt;
  els.channelCount.textContent = data.channels.length.toLocaleString();
  els.messageCount.textContent = data.totalMessages.toLocaleString();
  renderChannels();
  renderMessages();
}

els.channels.addEventListener('click', event => {
  const button = event.target.closest('[data-channel-id]');
  if (!button) return;
  state.channelId = button.dataset.channelId;
  render();
});
els.channelSearch.addEventListener('input', event => {
  state.channelSearch = event.target.value;
  renderChannels();
});
els.messageSearch.addEventListener('input', event => {
  state.messageSearch = event.target.value;
  renderMessages();
});
els.dateFrom.addEventListener('input', event => {
  state.dateFrom = event.target.value;
  renderMessages();
});
els.dateTo.addEventListener('input', event => {
  state.dateTo = event.target.value;
  renderMessages();
});
els.systemMode.addEventListener('change', event => {
  state.systemMode = event.target.value;
  renderMessages();
});

render();
</script>
</body>
</html>
